<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birth Pulse - Cinematic TV Pro V96</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: #000000;
            font-family: Arial, Helvetica, sans-serif; color: white;
            cursor: default; touch-action: none;
        }

        /* 1. SLEEP & QUIZ OVERLAYS */
        #sleep-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 10000; display: none; }
        #quiz-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); z-index: 9999; display: none;
            align-items: center; justify-content: center; pointer-events: auto;
        }
        .quiz-card { background: rgba(15, 23, 42, 0.98); border: 2px solid #a855f7; padding: 40px; border-radius: 20px; width: 65vw; text-align: center; }
        .option-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 1.4vw; font-weight: bold; cursor: pointer; }
        .option-btn:hover { background: #0b5ed7; border-color: white; }

        /* 2. KNOWLEDGE BUTTON - HIGHEST Z-INDEX */
        .knowledge-btn {
            position: fixed; bottom: 5vh; right: 5vw; z-index: 9000;
            padding: 15px 30px; background: rgba(109, 40, 217, 0.6);
            border: 2px solid #fbbf24; border-radius: 50px; color: white;
            font-weight: 800; font-size: 1.2vw; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; pointer-events: auto;
            animation: btn-pulse 2.5s infinite;
        }
        @keyframes btn-pulse { 0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); } 50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.5); } }

        /* 3. UI LAYOUT */
        .ui-root {
            position: absolute; left: 4vw; top: 0; bottom: 0;
            width: 45vw; z-index: 500; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 5vh 0 6vh 0;
        }

        .header-box { pointer-events: auto; }
        .philips-title { font-family: 'Poppins', Arial, sans-serif; font-size: 2.6vw; font-weight: 700; color: #ffffff; letter-spacing: 0.12vw; margin-bottom: 10px; text-transform: uppercase; }
        .main-heading { font-family: 'Poppins', Arial, sans-serif; font-size: 2.6vw; color: #a855f7; font-weight: 800; letter-spacing: 0.02vw; white-space: nowrap; }
        .main-heading span { display: inline-block; transition: all 0.5s ease; }
        
        @keyframes ampJump { 0%, 55%, 75%, 100% { transform: translateY(0); } 65% { transform: translateY(-20px); } }

        .firstchar { display: inline-block; color: #a855f7; }
        .w_amp { color: #a855f7 !important; margin: 0 0.5vw; animation: ampJump 3s infinite; }

        .stats-box { pointer-events: auto; width: 100%; }
        .label { font-size: 1.6vw; color: #38bdf8; text-transform: uppercase; font-weight: 900; letter-spacing: 3px; }
        .count { font-family: 'Rajdhani', Arial, sans-serif; font-variant-numeric: tabular-nums; display: inline-block; white-space: nowrap; font-size: 6.8vw; font-weight: 700; color: #fbbf24; line-height: 1; margin: 5px 0; }
        
        .progress-ui { width: 85%; margin-top: 15px; }
        .bar-wrapper {
            width: 100%; height: 18px; margin-top: 8px;
            background: rgba(56,189,248,0.18);
            border: 1px solid rgba(56,189,248,0.5);
            border-radius: 20px; overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 0 8px rgba(56,189,248,0.25);
        }
        .bar-fill {
            height: 100%; width: 0%; border-radius: 20px;
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde68a);
            box-shadow: 0 0 12px #fbbf24, 0 0 24px rgba(251,191,36,0.5);
            position: relative; overflow: hidden;
            transition: width 0.5s ease;
        }
        .bar-fill::after {
            content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            transform: translateX(-100%);
            animation: barShine 2.2s infinite;
        }
        @keyframes barShine { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
        #clock { font-family: 'Rajdhani', Arial, sans-serif; font-variant-numeric: tabular-nums; color: #fbbf24; font-size: 1.8vw; font-weight: 700; display: block; text-align: center; margin-top: 12px; }

        .regions-box { width: 100%; margin-top: 20px; }
        .regions-title { font-size: 1.1vw; color: #38bdf8; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px; }
        .region-globes { display: flex; gap: 0.8vw; }
        .region-item { display: flex; flex-direction: column; align-items: center; }
        .region-count { font-family: 'Rajdhani', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 1.5vw; font-weight: 700; color: #fbbf24; margin-bottom: 4px; }
        .region-canvas { width: 6.2vw; height: 6.2vw; filter: drop-shadow(0 0 6px rgba(56,189,248,0.35)); }
        .region-name { font-size: 0.95vw; color: #e2e8f0; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

        /* 4. CANVAS */
        .stars-container { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .star { position: absolute; background: #ffffff; border-radius: 50%; box-shadow: 0 0 4px rgba(255,255,255,0.9); animation: blink var(--t) infinite ease-in-out; animation-delay: var(--d); }
        @keyframes blink { 0%, 100% { opacity: 0.12; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.15); } }
        .star.bright { box-shadow: 0 0 6px #fff, 0 0 14px #bfdbfe, 0 0 22px rgba(147,197,253,0.7); }
        .canvas-container { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 5; }
        #main-canvas { width: 100%; height: 100%; cursor: grab; }
        #main-canvas:active { cursor: grabbing; }

        #loading { position: absolute; width: 100%; height: 100%; background: #000000; display: flex; align-items: center; justify-content: center; z-index: 11000; color: #38bdf8; font-size: 2.5vw; }
    </style>
</head>
<body>

    <div id="loading">CALIBRATING INTERACTION ENGINE...</div>
    <div id="sleep-overlay"></div>
    
    <div id="quiz-overlay">
        <div class="quiz-card">
            <h2 id="quiz-question" class="text-3xl font-bold mb-8 text-white">Question</h2>
            <div id="quiz-options"></div>
            <div id="quiz-feedback" class="mt-4"></div>
        </div>
    </div>

    <button class="knowledge-btn" id="quiz-trigger" onclick="openQuiz()">Press here for Knowledge check</button>

    <div class="ui-root">
        <div class="header-box">
            <div class="philips-title">PHILIPS</div>
            <h1 class="main-heading">
                <span class="firstchar fc1">M</span>other <span class="w_amp">&</span> <span class="firstchar fc2">C</span>hild <span class="firstchar fc3">C</span>are — Women's Health
            </h1>
        </div>

        <div class="stats-box">
            <span class="label">Global Birth Count Today</span>
            <div id="birthCount" class="count">0</div>
            <div class="progress-ui">
                <div class="flex justify-between w-[100%] mb-1 px-1">
                    <span class="text-cyan-400 font-bold text-[1.1vw]">00:00</span>
                    <span class="text-cyan-400 font-bold text-[1.1vw]">24:00</span>
                </div>
                <div class="bar-wrapper"><div id="bar" class="bar-fill"></div></div>
                <span id="clock">00:00:00</span>
            </div>
            <div class="regions-box">
                <div class="regions-title">Births Today by Region</div>
                <div class="region-globes">
                    <div class="region-item">
                        <span class="region-count" id="r-asia">0</span>
                        <canvas class="region-canvas" data-region="asia"></canvas>
                        <span class="region-name">Asia</span>
                    </div>
                    <div class="region-item">
                        <span class="region-count" id="r-africa">0</span>
                        <canvas class="region-canvas" data-region="africa"></canvas>
                        <span class="region-name">Africa</span>
                    </div>
                    <div class="region-item">
                        <span class="region-count" id="r-americas">0</span>
                        <canvas class="region-canvas" data-region="americas"></canvas>
                        <span class="region-name">Americas</span>
                    </div>
                    <div class="region-item">
                        <span class="region-count" id="r-europe">0</span>
                        <canvas class="region-canvas" data-region="europe"></canvas>
                        <span class="region-name">Europe</span>
                    </div>
                    <div class="region-item">
                        <span class="region-count" id="r-oceania">0</span>
                        <canvas class="region-canvas" data-region="oceania"></canvas>
                        <span class="region-name">Oceania</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="stars-container" id="starfield"></div>
    <div class="canvas-container"><canvas id="main-canvas"></canvas></div>

    <script>
        // --- TV-SAFE ES5 SCRIPT ---
        var BIRTH_RATE = 4.34, EARTH_ROT_SPD = 0.008, RESUME_DELAY = 5000, TARGET_TILT = -15;
        // Full page refresh interval (ms) to clear any accumulated memory/state on long-running TVs.
        var RELOAD_MS = 3 * 60 * 60 * 1000;
        // Max internal canvas resolution (longest side, px). Lower = smoother on 4K TVs.
        var RENDER_CAP = 1600;
        // Cap frame rate for steady, even motion on weak TV hardware (uneven 60fps looks juddery).
        var TARGET_FPS = 30, FRAME_MS = 1000 / TARGET_FPS, lastFrameTs = 0;
        // Continental share of global births (approx real-world distribution).
        var REGIONS = [
            { id: 'asia', share: 0.55 },
            { id: 'africa', share: 0.30 },
            { id: 'americas', share: 0.08 },
            { id: 'europe', share: 0.06 },
            { id: 'oceania', share: 0.01 }
        ];
        function fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

        // --- QUIZ DATA ---
        var quizData = [
            { q: "In which year was Philips founded?", o: ["1885", "1891", "1905", "1912"], a: 1 },
            { q: "Who founded Philips?", o: ["Gerard & Frederik", "Anton & Gerard", "Willem & Anton", "Gerard & Siemens"], a: 1 },
            { q: "Philips aims to improve how many lives by 2030?", o: ["100m", "500m", "1 billion", "5 billion"], a: 2 },
            { q: "What was Philips’ first main product?", o: ["Radios", "Shavers", "Light Bulbs", "X-ray"], a: 2 },
            { q: "In the 2010s, Philips shifted its primary focus to:", o: ["Electronics", "Healthcare technology", "Automotive", "Telecom"], a: 1 }
        ];

        var quizInactivityTimer = null, quizNextTimer = null;
        function openQuiz() {
            document.getElementById('quiz-overlay').style.display = "flex";
            showQuizQuestion();
            resetQuizInactivity();
        }
        function showQuizQuestion() {
            var qText = document.getElementById('quiz-question'), oBox = document.getElementById('quiz-options'), fBox = document.getElementById('quiz-feedback');
            fBox.innerHTML = ""; oBox.innerHTML = "";
            var qObj = quizData[Math.floor(Math.random() * quizData.length)];
            qText.innerText = qObj.q;
            for(var i=0; i<qObj.o.length; i++){
                var btn = document.createElement('button');
                btn.className = "option-btn"; btn.innerText = String.fromCharCode(65 + i) + ". " + qObj.o[i];
                btn.onclick = (function(idx, correct, correctText) {
                    return function() { answerQuiz(idx, correct, correctText); };
                })(i, qObj.a, qObj.o[qObj.a]);
                oBox.appendChild(btn);
            }
        }
        function answerQuiz(idx, correct, correctText) {
            var fBox = document.getElementById('quiz-feedback');
            if (idx === correct) { fBox.innerHTML = "<span style='color:#4ade80'>👍 Thumbs Up!</span>"; }
            else { fBox.innerHTML = "<span style='color:#f43f5e'>Better luck next time.</span><br><span style='color:white; font-size:1.5vw; font-weight:normal;'>Correct: " + correctText + "</span>"; }
            var btns = document.getElementById('quiz-options').getElementsByTagName('button');
            for (var b = 0; b < btns.length; b++) btns[b].disabled = true;
            resetQuizInactivity();
            clearTimeout(quizNextTimer);
            quizNextTimer = setTimeout(showQuizQuestion, 2500); // advance to the next question
        }
        function resetQuizInactivity() {
            clearTimeout(quizInactivityTimer);
            quizInactivityTimer = setTimeout(closeQuiz, 8000); // no touch for 8s -> back to main screen
        }
        function closeQuiz() {
            clearTimeout(quizNextTimer); clearTimeout(quizInactivityTimer);
            document.getElementById('quiz-overlay').style.display = "none";
        }
        // Any touch/click inside the quiz keeps it open (resets the 8s inactivity timer).
        (function () {
            var ov = document.getElementById('quiz-overlay');
            ov.addEventListener('click', resetQuizInactivity);
            ov.addEventListener('touchstart', resetQuizInactivity, { passive: true });
        })();

        // --- PHYSICS ENGINE ---
        var planets = [];
        // Tiny soothers (pacifiers) drifting through space like glowing, blinking asteroids.
        var soothers = [];
        for (var si = 0; si < 3; si++) {
            soothers.push({
                x: Math.random(), y: Math.random(),
                sz: 9 + Math.random() * 6,
                rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 0.0007,
                vx: (Math.random() - 0.5) * 0.00003, vy: (Math.random() - 0.5) * 0.00003,
                blink: Math.random() * Math.PI * 2,
                hue: 205 // fluorescent blue glow
            });
        }
        var worldGeo = null, featureIndex = {}, flashingISO = {}, comets = [];
        var globeOcean = null, globeAtmo = null, globeLand = null, globeDimKey = ""; // cached globe gradients (rebuilt only on resize)
        var canvas = document.getElementById("main-canvas"), context = canvas.getContext("2d");
        var w, h, isDragging = false, lastX, lastY, rotX = 0, rotY = TARGET_TILT, lastT = Date.now(), lastIntT = Date.now();

        function setSizes() {
            // Cap the internal render resolution so 4K TVs don't rasterize a huge canvas every frame (keeps motion smooth).
            var vw = window.innerWidth, vh = window.innerHeight;
            var scale = Math.min(1, RENDER_CAP / Math.max(vw, vh));
            w = Math.max(1, Math.round(vw * scale));
            h = Math.max(1, Math.round(vh * scale));
            canvas.width = w; canvas.height = h;
            context.imageSmoothingEnabled = true;
            // Keep the projection in sync with the canvas so land and ocean stay aligned after any resize.
            if (projection) projection.scale(h/2.8).translate([w*0.74, h*0.5]);
        }
        setSizes();
        var projection = d3.geoOrthographic().scale(h/2.8).translate([w*0.74, h*0.5]).clipAngle(90);
        var path = d3.geoPath(projection, context);

        // Recover the 2D context if the browser/GPU reclaims it after long uptime (prevents permanent blank screen).
        canvas.addEventListener('contextlost', function(e) { e.preventDefault(); }, false);
        canvas.addEventListener('contextrestored', function() {
            context = canvas.getContext("2d");
            path = d3.geoPath(projection, context);
            setSizes();
        }, false);

        // --- FIXED UNIVERSAL DRAG ---
        function startDrag(x, y) { isDragging = true; lastX = x; lastY = y; lastIntT = Date.now(); }
        function moveDrag(x, y) { 
            if (isDragging) {
                rotX += (x - lastX) * 0.3; rotY -= (y - lastY) * 0.3;
                lastX = x; lastY = y; lastIntT = Date.now();
            }
        }
        function endDrag() { isDragging = false; lastIntT = Date.now(); }

        canvas.addEventListener('mousedown', function(e) { startDrag(e.clientX, e.clientY); });
        window.addEventListener('mousemove', function(e) { moveDrag(e.clientX, e.clientY); });
        window.addEventListener('mouseup', endDrag);

        canvas.addEventListener('touchstart', function(e) { 
            if (e.touches.length > 0) { e.preventDefault(); startDrag(e.touches[0].clientX, e.touches[0].clientY); }
        }, {passive: false});
        window.addEventListener('touchmove', function(e) { 
            if (e.touches.length > 0) { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); }
        }, {passive: false});
        window.addEventListener('touchend', endDrag);

        // Always-on display: sleep overlay disabled so the TV never blanks out.
        document.getElementById('sleep-overlay').style.display = 'none';

        function init() {
            d3.json("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson").then(function(data) {
                // Drop Antarctica / open-ocean polygons: they wrap the pole and flash across the globe when clipped at the horizon.
                data.features = data.features.filter(function(f) {
                    var c = f.properties.CONTINENT;
                    return c !== 'Antarctica' && c !== 'Seven seas (open ocean)';
                });
                simplifyGeo(data, 0.18); // shape-preserving vertex reduction => cheaper per-frame projection => smoother rotation
                worldGeo = data;
                for(var i=0; i<data.features.length; i++){ var f = data.features[i]; featureIndex[f.properties.ISO_A3 || f.properties.ADM0_A3] = f; }
                document.getElementById('loading').style.display='none';
                initRegionGlobes(); drawRegionGlobes(0);
                requestAnimationFrame(renderLoop); startSimulation();
            });
        }

        // Douglas-Peucker simplification: cut vertex count while preserving the actual coastline shape.
        function dpPerp(px, py, ax, ay, bx, by) {
            var dx = bx - ax, dy = by - ay;
            if (dx === 0 && dy === 0) { dx = px - ax; dy = py - ay; return Math.sqrt(dx * dx + dy * dy); }
            var t = ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy);
            var cx = ax + t * dx, cy = ay + t * dy, ex = px - cx, ey = py - cy;
            return Math.sqrt(ex * ex + ey * ey);
        }
        function dpRing(pts, eps) {
            if (pts.length < 5) return pts;
            var keep = new Array(pts.length); keep[0] = keep[pts.length - 1] = true;
            var stack = [[0, pts.length - 1]];
            while (stack.length) {
                var rg = stack.pop(), first = rg[0], last = rg[1], maxD = 0, idx = -1;
                var ax = pts[first][0], ay = pts[first][1], bx = pts[last][0], by = pts[last][1];
                for (var i = first + 1; i < last; i++) {
                    var d = dpPerp(pts[i][0], pts[i][1], ax, ay, bx, by);
                    if (d > maxD) { maxD = d; idx = i; }
                }
                if (maxD > eps && idx !== -1) { keep[idx] = true; stack.push([first, idx]); stack.push([idx, last]); }
            }
            var out = [];
            for (var i = 0; i < pts.length; i++) if (keep[i]) out.push(pts[i]);
            return out;
        }
        function simplifyGeo(geo, eps) {
            function ring(r) { return r.length <= 6 ? r : dpRing(r, eps); }
            for (var f = 0; f < geo.features.length; f++) {
                var g = geo.features[f].geometry; if (!g) continue;
                if (g.type === 'Polygon') {
                    for (var p = 0; p < g.coordinates.length; p++) g.coordinates[p] = ring(g.coordinates[p]);
                } else if (g.type === 'MultiPolygon') {
                    for (var m = 0; m < g.coordinates.length; m++)
                        for (var q = 0; q < g.coordinates[m].length; q++) g.coordinates[m][q] = ring(g.coordinates[m][q]);
                }
            }
        }

        // Per-region mini globes: view angle [-lon,-lat] centered on each continent, and which CONTINENT values to highlight.
        var REGION_VIEW = { asia:[-90,-30], africa:[-20,0], europe:[-15,-50], americas:[80,-10], oceania:[-140,25] };
        var REGION_CONTINENTS = { asia:['Asia'], africa:['Africa'], europe:['Europe'], americas:['North America','South America'], oceania:['Oceania'] };
        // One region globe spins at a time (cycling through regions); the rest stay static — keeps the main scene smooth.
        var REGION_SPIN_SPD = 0.06, regionSpin = 0, regionPhase = 'spin', regionPauseUntil = 0, regionActive = 0, regionCache = [];
        var REGION_FRAME_MS = 1000 / 20, regionAccum = 0; // redraw only the active mini globe, throttled
        function initRegionGlobes() {
            var list = document.querySelectorAll('.region-canvas'), size = 180;
            regionCache = [];
            for (var i = 0; i < list.length; i++) {
                var cv = list[i]; cv.width = size; cv.height = size;
                var ctx = cv.getContext('2d'), r = size / 2 - 6, cx = size / 2, cy = size / 2;
                var proj = d3.geoOrthographic().scale(r).translate([cx, cy]).clipAngle(90);
                var og = ctx.createRadialGradient(cx - r / 3, cy - r / 3, r / 8, cx, cy, r);
                og.addColorStop(0, '#60a5fa'); og.addColorStop(0.6, '#0a192f'); og.addColorStop(1, '#020617');
                regionCache.push({ ctx: ctx, proj: proj, path: d3.geoPath(proj, ctx), region: cv.getAttribute('data-region'), size: size, r: r, ocean: og });
            }
        }
        function drawRegionAt(idx, spin) {
            var rc = regionCache[idx], view = REGION_VIEW[rc.region];
            rc.proj.rotate([view[0] + spin, view[1]]);
            drawOneRegion(rc);
        }
        function drawRegionGlobes(spin) { // draw all (used once at init so every globe shows its region)
            for (var i = 0; i < regionCache.length; i++) drawRegionAt(i, spin);
        }
        function drawOneRegion(rc) {
            var ctx = rc.ctx, cx = rc.size / 2, cy = rc.size / 2, r = rc.r, p = rc.path;
            ctx.clearRect(0, 0, rc.size, rc.size);
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = rc.ocean; ctx.fill();
            ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
            var conts = REGION_CONTINENTS[rc.region];
            for (var i = 0; i < worldGeo.features.length; i++) {
                var f = worldGeo.features[i];
                ctx.beginPath(); p(f);
                ctx.fillStyle = conts.indexOf(f.properties.CONTINENT) !== -1 ? '#ffd700' : 'rgba(16,185,129,0.30)';
                ctx.fill();
            }
            ctx.restore();
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(56,189,248,0.6)'; ctx.stroke();
        }
        function updateRegionGlobes(now, dt) {
            if (!worldGeo || !regionCache.length) return;
            if (regionPhase === 'pause') {
                if (now < regionPauseUntil) return;            // hold the finished globe on its region for 1s
                regionActive = (regionActive + 1) % regionCache.length; // hand off to the next region
                regionSpin = 0; regionPhase = 'spin'; regionAccum = 0;
            }
            regionAccum += dt;
            if (regionAccum < REGION_FRAME_MS) return;         // throttle the active globe's redraws
            regionSpin += REGION_SPIN_SPD * regionAccum;       // advance by elapsed time so spin speed stays constant
            regionAccum = 0;
            if (regionSpin >= 360) {                           // finished a revolution -> settle centered, then pause
                regionSpin = 0; regionPhase = 'pause'; regionPauseUntil = now + 1000;
                drawRegionAt(regionActive, 0);
            } else {
                drawRegionAt(regionActive, regionSpin);
            }
        }

        function renderLoop(ts) {
            // Schedule the next frame FIRST so a transient draw error can never kill the loop and blank the TV.
            requestAnimationFrame(renderLoop);
            if (ts && ts - lastFrameTs < FRAME_MS) return; // hold to the target frame rate
            lastFrameTs = ts || 0;
            try { renderFrame(); } catch (err) { if (window.console) console.warn('render frame skipped:', err); }
        }

        function renderFrame() {
            var now = Date.now(), dt = now - lastT; lastT = now;
            if (dt < 0 || dt > 1000) dt = 16; // clamp after tab throttling / context recovery

            // Keep rotation bounded and finite to avoid float precision loss and non-finite draw coords over long runtimes.
            if (!isFinite(rotX)) rotX = 0;
            if (!isFinite(rotY)) rotY = TARGET_TILT;
            rotX = rotX % 360;

            // --- AUTO RESUME LOGIC ---
            if (!isDragging) {
                if (now - lastIntT > RESUME_DELAY) {
                    rotX += EARTH_ROT_SPD * dt;
                    if (Math.abs(rotY - TARGET_TILT) > 0.1) rotY += (TARGET_TILT - rotY) * 0.02;
                    else rotY = TARGET_TILT;
                }
            }

            projection.rotate([rotX, rotY]);
            context.clearRect(0,0,w,h);
            // Derive the globe center from the projection so ocean and land can never separate.
            var ptr = projection.translate(), ex = ptr[0], ey = ptr[1];

            var sAng = now * 0.00003, sx = ex + Math.cos(sAng)*(w*0.55), sy = ey + Math.sin(sAng)*(h*0.4);
            var sunR = 90;
            // Soft outer corona glow (kept separate so the disc stays crisp)
            var coronaGrad = context.createRadialGradient(sx,sy,sunR*0.9,sx,sy,sunR*2.4);
            coronaGrad.addColorStop(0,"rgba(251, 191, 36, 0.45)"); coronaGrad.addColorStop(0.5,"rgba(251, 146, 60, 0.18)"); coronaGrad.addColorStop(1,"transparent");
            context.beginPath(); context.arc(sx,sy,sunR*2.4,0,7); context.fillStyle=coronaGrad; context.fill();
            // Sharp, focused sun disc with a defined edge (corona above already supplies the glow)
            var sGrad = context.createRadialGradient(sx,sy,0,sx,sy,sunR);
            sGrad.addColorStop(0,"#ffffff"); sGrad.addColorStop(0.45,"#fef3c7"); sGrad.addColorStop(0.8,"#fcd34d"); sGrad.addColorStop(1,"#f59e0b");
            context.beginPath(); context.arc(sx,sy,sunR,0,7); context.fillStyle=sGrad; context.fill();

            for(var i=0; i<planets.length; i++) drawPlanet(planets[i], ex, ey, sx, sy, dt);

            var radius = projection.scale();
            // Cache the ocean + atmosphere gradients; only rebuild when the canvas size changes (perf on TV).
            if (globeDimKey !== w + 'x' + h) {
                globeAtmo = context.createRadialGradient(ex, ey, radius*0.9, ex, ey, radius*1.12);
                globeAtmo.addColorStop(0, "rgba(56,189,248,0.0)"); globeAtmo.addColorStop(0.5, "rgba(56,189,248,0.4)"); globeAtmo.addColorStop(1, "transparent");
                globeOcean = context.createRadialGradient(ex-radius/2.4, ey-radius/2.4, radius/18, ex, ey, radius);
                globeOcean.addColorStop(0, "#7dd3fc"); globeOcean.addColorStop(0.3, "#2563eb"); globeOcean.addColorStop(0.65, "#0c1e42"); globeOcean.addColorStop(0.92, "#030a1c"); globeOcean.addColorStop(1, "#01040f");
                globeLand = context.createRadialGradient(ex-radius/2.4, ey-radius/2.4, radius/10, ex, ey, radius);
                globeLand.addColorStop(0, "#5cf2c0"); globeLand.addColorStop(0.5, "#1fbf8f"); globeLand.addColorStop(0.9, "#0a6b50"); globeLand.addColorStop(1, "#064632");
                globeDimKey = w + 'x' + h;
            }
            context.beginPath(); context.arc(ex, ey, radius*1.12, 0, 7); context.fillStyle = globeAtmo; context.fill();
            context.beginPath(); context.arc(ex, ey, radius, 0, 7); context.fillStyle = globeOcean; context.fill();

            if (worldGeo) {
                // Clip to the globe disc so no country fill can ever spill across the screen.
                context.save();
                context.beginPath(); context.arc(ex, ey, radius, 0, 7); context.clip();
                // Draw each country separately so horizon clipping can't flip the fill and flash the whole globe green.
                context.fillStyle = globeLand;
                for (var fi = 0; fi < worldGeo.features.length; fi++) {
                    context.beginPath(); path(worldGeo.features[fi]);
                    context.fill();
                }
                context.restore();

                // Birth flashes: a bright gold pulse per country, held bright then fading for clear visibility
                var FLASH_MS = 1400;
                for (var iso in flashingISO) {
                    var age = now - flashingISO[iso];
                    if (age < FLASH_MS) {
                        var feat = featureIndex[iso];
                        if (feat) {
                            var fade = Math.min(1, (1 - age / FLASH_MS) * 1.8); // stay fully bright, then fade
                            context.save();
                            context.globalAlpha = fade;
                            context.beginPath(); path(feat);
                            context.fillStyle = "#ffd700"; context.fill();
                            context.lineWidth = 2.5; context.strokeStyle = "#ffffff"; context.stroke();
                            context.restore();
                        }
                    } else { delete flashingISO[iso]; }
                }
            }
            drawSoothers(now, dt);
            updateComets(dt);
            updateRegionGlobes(now, dt);
        }

        function drawPlanet(p,ex,ey,sx,sy,dt){
            p.ang += p.spd*dt*0.1; var px=ex+Math.cos(p.ang)*p.d, py=ey+Math.sin(p.ang)*p.d*0.7;
            var dx=px-sx, dy=py-sy, ang=Math.atan2(dy,dx);
            context.save(); context.translate(px,py);
            var g=context.createRadialGradient(-p.sz*0.3,-p.sz*0.3,0,0,0,p.sz); g.addColorStop(0,p.col); g.addColorStop(1,"#000");
            context.beginPath(); context.arc(0,0,p.sz,0,7); context.fillStyle=g; context.fill();
            context.restore();
            var shad=context.createRadialGradient(px+Math.cos(ang)*p.sz*0.5, py+Math.sin(ang)*p.sz*0.5, 0, px,py,p.sz);
            shad.addColorStop(0,"rgba(0,0,0,0)"); shad.addColorStop(1,"rgba(0,0,0,0.9)");
            context.beginPath(); context.arc(px,py,p.sz+0.5,0,7); context.fillStyle=shad; context.fill();
        }

        function drawSoothers(now, dt) {
            for (var i = 0; i < soothers.length; i++) {
                var s = soothers[i];
                s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vrot * dt;
                if (s.x < -0.05) s.x = 1.05; else if (s.x > 1.05) s.x = -0.05;
                if (s.y < -0.05) s.y = 1.05; else if (s.y > 1.05) s.y = -0.05;
                var alpha = 0.35 + 0.55 * Math.abs(Math.sin(now * 0.002 + s.blink)); // blink
                drawSoother(s.x * w, s.y * h, s.sz, s.rot, s.hue, alpha);
            }
        }

        function drawSoother(px, py, r, rot, hue, alpha) {
            var col = 'hsl(' + hue + ', 95%, 68%)', deep = 'hsl(' + hue + ', 90%, 42%)', light = 'hsl(' + hue + ', 100%, 85%)', glow = 'hsl(' + hue + ', 100%, 55%)';
            context.save();
            context.translate(px, py); context.rotate(rot);
            context.globalAlpha = alpha;
            context.lineCap = 'round'; context.lineJoin = 'round';
            context.shadowBlur = 5; context.shadowColor = glow;
            // Ring handle (torus) at top
            context.lineWidth = r * 0.4; context.strokeStyle = col;
            context.beginPath(); context.arc(0, -r * 1.95, r * 0.78, 0, 7); context.stroke();
            // Ring highlight
            context.lineWidth = r * 0.15; context.strokeStyle = light;
            context.beginPath(); context.arc(0, -r * 1.95, r * 0.78, Math.PI * 1.05, Math.PI * 1.55); context.stroke();
            // Connector stem between ring and shield
            context.shadowBlur = 3; context.lineWidth = r * 0.34; context.strokeStyle = deep;
            context.beginPath(); context.moveTo(0, -r * 1.25); context.lineTo(0, -r * 0.55); context.stroke();
            // Shield / guard — wide oval with 3D shading
            context.shadowBlur = 6;
            var g = context.createRadialGradient(-r * 0.4, -r * 0.4, 0, 0, 0, r * 1.7);
            g.addColorStop(0, light); g.addColorStop(0.55, col); g.addColorStop(1, deep);
            context.fillStyle = g;
            context.beginPath(); context.ellipse(0, 0, r * 1.6, r * 1.05, 0, 0, 7); context.fill();
            context.shadowBlur = 0; context.lineWidth = r * 0.12; context.strokeStyle = deep; context.stroke();
            // Glossy highlight on the shield
            context.globalAlpha = alpha * 0.5; context.fillStyle = light;
            context.beginPath(); context.ellipse(-r * 0.45, -r * 0.42, r * 0.6, r * 0.28, -0.5, 0, 7); context.fill();
            context.globalAlpha = alpha;
            // Two air holes
            context.fillStyle = deep;
            context.beginPath(); context.arc(-r * 0.62, 0, r * 0.16, 0, 7); context.fill();
            context.beginPath(); context.arc(r * 0.62, 0, r * 0.16, 0, 7); context.fill();
            // Teat base collar
            context.fillStyle = col;
            context.beginPath(); context.ellipse(0, r * 1.0, r * 0.42, r * 0.22, 0, 0, 7); context.fill();
            // Teat / nipple bulb with a narrow neck
            var tg = context.createRadialGradient(-r * 0.15, r * 1.4, 0, 0, r * 1.5, r * 0.7);
            tg.addColorStop(0, light); tg.addColorStop(1, col);
            context.fillStyle = tg;
            context.beginPath();
            context.moveTo(-r * 0.26, r * 1.05);
            context.quadraticCurveTo(-r * 0.58, r * 1.75, 0, r * 1.9);
            context.quadraticCurveTo(r * 0.58, r * 1.75, r * 0.26, r * 1.05);
            context.closePath(); context.fill();
            context.restore();
        }

        function updateComets(dt) {
            var f = dt / 16.6667; // normalize movement to 60fps so speed is framerate-independent
            if (Math.random() > 0.986) {
                var angle = 0.28 + Math.random() * 0.28;   // downward, leftward trajectory
                var speed = 6 + Math.random() * 6;
                comets.push({
                    x: w * (0.35 + Math.random() * 0.65), y: -60,
                    vx: -Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    r: 1 + Math.random() * 1.3, tail: 160 + Math.random() * 170, life: 1
                });
            }
            for (var i = 0; i < comets.length; i++) {
                var c = comets[i];
                var sp = Math.sqrt(c.vx*c.vx + c.vy*c.vy) || 1;
                var ux = -c.vx / sp, uy = -c.vy / sp;                 // tail trails opposite to motion
                var tx = c.x + ux * c.tail, ty = c.y + uy * c.tail;
                context.save();
                // Tapering luminous tail: widest at the head, narrowing to a point (thin & wispy)
                var perpx = -uy, perpy = ux, hw = c.r;
                var g = context.createLinearGradient(c.x, c.y, tx, ty);
                g.addColorStop(0, "rgba(255,255,255," + (0.95 * c.life) + ")");
                g.addColorStop(0.2, "rgba(219,234,254," + (0.5 * c.life) + ")");
                g.addColorStop(1, "rgba(147,197,253,0)");
                context.shadowBlur = 8; context.shadowColor = "rgba(191,219,254," + (0.8 * c.life) + ")";
                context.beginPath();
                context.moveTo(c.x + perpx * hw, c.y + perpy * hw);
                context.lineTo(c.x - perpx * hw, c.y - perpy * hw);
                context.lineTo(tx, ty);
                context.closePath();
                context.fillStyle = g; context.fill();
                // Coma (soft halo around the nucleus)
                context.shadowBlur = 0;
                var coma = context.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 3.5);
                coma.addColorStop(0, "rgba(255,255,255," + c.life + ")");
                coma.addColorStop(0.4, "rgba(191,219,254," + (0.4 * c.life) + ")");
                coma.addColorStop(1, "transparent");
                context.beginPath(); context.arc(c.x, c.y, c.r * 3.5, 0, 7); context.fillStyle = coma; context.fill();
                // Bright nucleus
                context.beginPath(); context.arc(c.x, c.y, c.r * 0.9, 0, 7); context.fillStyle = "#ffffff"; context.fill();
                context.restore();
                c.x += c.vx * f; c.y += c.vy * f; c.life -= 0.006 * f;
                if (c.life <= 0 || c.x < -150 || c.y > h + 150) { comets.splice(i, 1); i--; }
            }
        }

        function startSimulation() {
            // Flashes fire frequently (canvas only, cheap) so each birth still lights up the globe.
            setInterval(function() {
                if (worldGeo) { var keys = Object.keys(featureIndex); flashingISO[keys[Math.floor(Math.random()*keys.length)]] = Date.now(); }
            }, 1000 / BIRTH_RATE);
            // DOM text updates once per second: frequent updates forced reflows that stuttered the rotation.
            function updateStats() {
                var now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                var elapsed = (Date.now() - start) / 1000;
                var total = Math.floor(elapsed * BIRTH_RATE);
                document.getElementById('birthCount').innerText = fmt(total);
                for (var ri = 0; ri < REGIONS.length; ri++) {
                    var rel = document.getElementById('r-' + REGIONS[ri].id);
                    if (rel) rel.innerText = fmt(Math.floor(total * REGIONS[ri].share));
                }
                document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
                document.getElementById('bar').style.width = (elapsed / 86400 * 100) + "%";
            }
            updateStats();
            setInterval(updateStats, 1000);
        }

        var field = document.getElementById('starfield');
        for (var i = 0; i < 110; i++) {
            var s = document.createElement('div'); s.className = 'star';
            var bright = Math.random() > 0.82;
            if (bright) s.className += ' bright';
            var size = bright ? (2 + Math.random()*2.5) : (0.8 + Math.random()*1.6);
            s.style.width = s.style.height = size + 'px';
            s.style.left = Math.random()*100 + '%'; s.style.top = Math.random()*100 + '%';
            s.style.setProperty('--t', (1.5 + Math.random()*3.5) + 's');
            s.style.setProperty('--d', (Math.random()*4) + 's');
            field.appendChild(s);
        }
        window.onresize = function() { setSizes(); fitProgress(); }; init();

        // Match the progress bar width to the label above it, and size the counter to that width (fixed).
        var countLabel = document.querySelector('.stats-box .label');
        var progressUI = document.querySelector('.progress-ui');
        var countEl = document.getElementById('birthCount');
        function fitProgress() {
            if (!countLabel || !progressUI) return;
            var w = countLabel.getBoundingClientRect().width;
            if (w > 0) progressUI.style.width = w + 'px';
            fitCounter(w);
        }
        function fitCounter(w) {
            if (!countEl || !w) return;
            var prev = countEl.innerText;
            countEl.innerText = "888.888"; // widest expected value so real numbers never overflow
            var cur = countEl.getBoundingClientRect().width;
            var base = parseFloat(getComputedStyle(countEl).fontSize);
            if (cur > 0) countEl.style.fontSize = (base * (w / cur)) + 'px';
            countEl.innerText = prev;
        }
        fitProgress();
        window.addEventListener('load', fitProgress);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitProgress);


        // Kiosk safety net: periodically refresh to clear accumulated memory/state; skip while a user is interacting.
        setInterval(function() {
            if (!isDragging && document.getElementById('quiz-overlay').style.display !== 'flex') {
                location.reload();
            }
        }, RELOAD_MS);
    </script>
</body>
</html>
